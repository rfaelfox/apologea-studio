name: Windows-Version veröffentlichen

# Läuft, sobald auf main die Version in package.json geändert wird.
# electron-builder legt dabei das Release samt Tag v<version> selbst an.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer bauen und als GitHub-Release hochladen
        shell: bash
        run: npx electron-builder --win --x64 --publish always --config.win.signAndEditExecutable=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
